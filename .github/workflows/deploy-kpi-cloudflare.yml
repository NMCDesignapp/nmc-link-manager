name: Deploy standalone KPI to Cloudflare

# Kept manual until the Cloudflare CI credentials are configured in GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kpi-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kpi-app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_MAIN_APP_URL: ${{ vars.NEXT_PUBLIC_MAIN_APP_URL }}
      NMC_MAIN_APP_URL: ${{ vars.NEXT_PUBLIC_MAIN_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kpi-app/package-lock.json

      - name: Install KPI dependencies
        run: npm ci

      - name: Verify KPI source synchronization
        run: npm run sync:check

      - name: Build Worker
        run: npm run cf:build

      - name: Upload Linux Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: nmc-kpi-open-next
          path: kpi-app/.open-next
          include-hidden-files: true
          retention-days: 1

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx opennextjs-cloudflare deploy
