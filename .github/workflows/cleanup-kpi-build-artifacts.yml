name: Clean KPI build artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-kpi-build-artifacts.yml
      - kpi-app/.gitignore

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kpi-speed-month-banner-20260803
          fetch-depth: 0
      - name: Remove generated build output
        run: |
          git rm -r --ignore-unmatch kpi-app/.next
          rm .github/workflows/cleanup-kpi-build-artifacts.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No cleanup needed"; exit 1; }
          git commit -m "Remove generated KPI build artifacts"
          git push origin HEAD:feature/kpi-speed-month-banner-20260803
