name: Apply synchronization status line

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-sync-status-line.cjs
      - .github/workflows/apply-sync-status-line.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sync-status-line-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-sync-status-line.cjs
      - name: Verify status line
        run: |
          grep -q "Excel trên máy tính chưa kết nối" src/app/quan-ly/page.tsx
          grep -q "nmc-google-last-sync-at" src/app/api/sync-source/route.ts
          grep -q "setSyncLastAt(status.lastSyncAt" src/app/quan-ly/page.tsx
      - name: Remove one-time files
        run: |
          rm scripts/apply-sync-status-line.cjs
          rm .github/workflows/apply-sync-status-line.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Show synchronization status and latest update time"
          git push origin HEAD:feature/sync-status-line-20260803
