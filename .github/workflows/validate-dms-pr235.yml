name: Validate DMS and TVV notes (branch only)
on:
  push:
    branches:
      - feature/dms-apm01-bc02-shadow-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/dms-auto-source.test.mjs
      - run: node --experimental-strip-types --test tests/tvv-notes-import.test.ts
      - run: npm run lint
      - run: npm run build
