name: Apply exclusive sync source changes

on:
  push:
    branches:
      - feature/exclusive-sync-source-20260803
    paths:
      - scripts/apply-exclusive-sync-source.cjs
      - .github/workflows/apply-exclusive-sync-source.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-exclusive-sync-source.cjs
      - .github/workflows/apply-exclusive-sync-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exclusive-sync-source-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-exclusive-sync-source.cjs
      - name: Verify source locks
        run: |
          grep -q "fromGoogleSync" src/app/api/sync/route.ts
          grep -q "nmc-sync-source" src/app/quan-ly/page.tsx
          grep -q "/api/data-hub/status" data-hub/index.mjs
          grep -q "getSyncSource" kpi-app/src/app/api/saoviet-data/sync-all/route.ts
      - name: Remove one-time patch files
        run: |
          rm scripts/apply-exclusive-sync-source.cjs
          rm .github/workflows/apply-exclusive-sync-source.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Enforce exclusive Excel or Google synchronization"
          git push origin HEAD:feature/exclusive-sync-source-20260803
