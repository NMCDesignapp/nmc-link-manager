name: Build clean Android wrappers

on:
  workflow_dispatch:
  push:
    branches:
      - android-wrapper-clean-build
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-wrapper-clean.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-wrapper-clean.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs from source
        run: gradle -p android-wrapper :app:assembleDebug :app:assembleRelease --stacktrace

      - name: List APK outputs
        run: find android-wrapper/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Boot emulator, install NC-Link and verify startup + exit dialog
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            APK="android-wrapper/app/build/outputs/apk/nclink/debug/app-nclink-debug.apk"
            adb install -r "$APK"
            adb shell am force-stop vn.nclink.manager
            adb shell am start -n vn.nclink.manager/vn.nclink.webwrapper.SplashActivity
            sleep 5
            adb shell pidof vn.nclink.manager
            adb shell dumpsys activity activities | grep -F 'vn.nclink.webwrapper.MainActivity'
            adb shell input keyevent 4
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -F 'Thoát ứng dụng?'

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: clean-android-wrapper-release-apks
          path: android-wrapper/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
