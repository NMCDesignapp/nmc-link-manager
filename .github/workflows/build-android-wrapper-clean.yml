name: Build clean Android wrappers

on:
  workflow_dispatch:
  push:
    branches:
      - android-wrapper-clean-build
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-wrapper-clean.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-wrapper-clean.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs from source
        run: gradle -p android-wrapper :app:assembleDebug :app:assembleRelease --stacktrace

      - name: List APK outputs
        run: find android-wrapper/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Boot emulator, install NC-Link and verify startup + Back safety
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-wrapper/app/build/outputs/apk/nclink/debug/app-nclink-debug.apk
            adb shell am force-stop vn.nclink.manager
            adb shell am start -n vn.nclink.manager/vn.nclink.webwrapper.SplashActivity
            sleep 5
            adb shell pidof vn.nclink.manager
            adb shell dumpsys activity activities | grep -F 'vn.nclink.webwrapper.MainActivity'
            grep -F '.setTitle("Thoát ứng dụng?")' android-wrapper/app/src/main/java/vn/nclink/webwrapper/MainActivity.java
            adb shell input keyevent 4
            sleep 1
            adb shell pidof vn.nclink.manager
            adb shell dumpsys activity activities | grep -F 'vn.nclink.webwrapper.MainActivity'

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: clean-android-wrapper-release-apks
          path: android-wrapper/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
