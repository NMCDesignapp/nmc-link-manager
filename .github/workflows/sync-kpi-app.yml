name: Manual fallback sync for kpi-app

# Luồng chính hiện tại: Vercel chạy scripts/sync-kpi-app.sh trong prebuild,
# vì vậy KPI standalone luôn lấy mã nguồn mới nhất từ Main App trước khi build.
# Workflow này chỉ giữ lại như công cụ dự phòng để cập nhật bản generated
# trong thư mục kpi-app/ của repository khi cần kiểm tra hoặc lưu snapshot.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-sync-kpi-app
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync standalone KPI from Main App
        run: bash scripts/sync-kpi-app.sh

      - name: Commit generated snapshot when changed
        run: |
          if [ -z "$(git status --porcelain -- kpi-app/)" ]; then
            echo "KPI snapshot is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kpi-app/
          git commit -m "chore(kpi-app): refresh generated snapshot"
          git push
