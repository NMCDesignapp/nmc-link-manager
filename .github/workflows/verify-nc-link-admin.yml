name: Verify NC-Link admin navigation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/kpi/page.tsx'
      - 'src/app/nc-link/page.tsx'
      - 'src/lib/admin-session.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-nc-link-admin.yml'

permissions:
  contents: read

concurrency:
  group: verify-nc-link-admin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      POSTGRES_PRISMA_URL: 'postgresql://ci:ci@127.0.0.1:5432/nmc_ci?schema=public'
      POSTGRES_URL_NON_POOLING: 'postgresql://ci:ci@127.0.0.1:5432/nmc_ci?schema=public'
      NEXT_PUBLIC_MAIN_APP_URL: 'https://nc-link.vercel.app'
      NMC_ADMIN_PASSWORD: 'ci-placeholder-only'
      NMC_ADMIN_SESSION_SECRET: 'ci-placeholder-session-secret-32-characters'
      NMC_DATA_HUB_IMPORT_TOKEN: 'ci-placeholder-only'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed Admin navigation files
        run: npx eslint src/app/kpi/page.tsx src/app/nc-link/page.tsx src/lib/admin-session.ts

      - name: Run tests and production build
        run: npm run build
