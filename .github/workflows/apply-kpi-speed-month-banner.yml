name: Apply KPI speed month banner improvements

on:
  push:
    branches:
      - feature/kpi-speed-month-banner-20260803
    paths:
      - scripts/apply-kpi-speed-month-banner.cjs
      - .github/workflows/apply-kpi-speed-month-banner.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kpi-speed-month-banner-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply KPI patch with diagnostics
        run: |
          set +e
          node scripts/apply-kpi-speed-month-banner.cjs > /tmp/kpi-patch.log 2>&1
          code=$?
          cat /tmp/kpi-patch.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/kpi-patch.log kpi-patch-debug.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kpi-patch-debug.log
            git commit -m "Record KPI patch failure diagnostics" || true
            git push origin HEAD:feature/kpi-speed-month-banner-20260803 || true
            exit "$code"
          fi
      - name: Sync standalone KPI
        run: bash scripts/sync-kpi-app.sh
      - name: Verify source changes
        run: |
          grep -q "tamthuDetailFetchedAtRef" src/app/kpi/page.tsx
          grep -q "void fetchTamthuDetail(true)" src/app/kpi/page.tsx
          grep -q "kpiNoticeControlScroll" src/app/kpi/page.tsx
          grep -q "background: rgba(255, 244, 190, .68)" src/app/kpi/page.tsx
          grep -q "Đăng ký mục tiêu tháng.*NOW.getMonth() + 1" src/app/kpi/page.tsx
          ! grep -q "setView('tamthu-detail'); fetchData();" src/app/kpi/page.tsx
          grep -q "tamthuDetailFetchedAtRef" kpi-app/src/app/page.tsx
          grep -q "kpiNoticeControlScroll" kpi-app/src/app/page.tsx
      - name: Install main dependencies
        run: npm ci
      - name: Build main app
        run: npm run build
      - name: Install standalone dependencies
        working-directory: kpi-app
        run: npm ci
      - name: Build standalone KPI
        working-directory: kpi-app
        run: npm run build
      - name: Remove one-time files
        run: |
          rm scripts/apply-kpi-speed-month-banner.cjs
          rm .github/workflows/apply-kpi-speed-month-banner.yml
          rm -f kpi-patch-debug.log
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Improve KPI tạm thu loading, current month and notice band"
          git push origin HEAD:feature/kpi-speed-month-banner-20260803
