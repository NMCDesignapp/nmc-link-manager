name: Apply PA code ordering fix

on:
  push:
    branches:
      - fix/thi-dua-pa-code-order-20260803
    paths:
      - scripts/apply-pa-code-order-fix.cjs
      - .github/workflows/apply-pa-code-order-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/thi-dua-pa-code-order-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-pa-code-order-fix.cjs
      - name: Verify
        run: |
          grep -q "value === 'U104101014'" src/app/thi-dua-chau/page.tsx
          grep -q "value === 'U104101014'" src/lib/contest-calculator.ts
      - name: Remove one-time patch files
        run: |
          rm scripts/apply-pa-code-order-fix.cjs
          rm .github/workflows/apply-pa-code-order-fix.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Recognize PA structure code in contest ordering"
          git push origin HEAD:fix/thi-dua-pa-code-order-20260803
